apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-app-alert-rules
  labels:
    release: prom-stack
    app: flask-app
spec:
  groups:
    - name: flask-app.rules
      rules:
        - alert: HighPodCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{
              namespace="default",
              pod=~"flask-app-.*",
              container!="",
              container!="POD"
            }[2m])) by (pod)
            > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage is above 50% for 2 minutes."

        - alert: HighPodCPUUsageCritical
          expr: |
            sum(rate(container_cpu_usage_seconds_total{
              namespace="default",
              pod=~"flask-app-.*",
              container!="",
              container!="POD"
            }[2m])) by (pod)
            > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Critical CPU usage on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage is above 80% for 5 minutes."

        - alert: PodRestartCountHigh
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="default",
              pod=~"flask-app-.*"
            }[10m]) > 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High restart count on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} restarted more than 3 times in 10 minutes."

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="default",
              pod=~"flask-app-.*"
            }[5m]) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod crash looping: {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} is likely in CrashLoopBackOff."

        - alert: HighErrorRate
          expr: |
            sum(rate(flask_http_request_total{status=~"5.."}[2m]))
            /
            sum(rate(flask_http_request_total[2m]))
            > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for the last 2 minutes."

        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(flask_http_request_duration_seconds_bucket[2m])) by (le)
            ) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected (p95)"
            description: "95th percentile latency is above 500ms for the last 2 minutes."