# high-cpu-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  labels:
    app: cpu-stress
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--cpu", "4", "--timeout", "600s"]
      resources:
        limits:
          cpu: "1"
        requests:
          cpu: "0.1"
